# Override to run only CVMS core services since you already have monitoring stack
services:
  # Keep only the CVMS core components - inherit all config from base docker-compose.yaml
  exporter:
    # CVMS Exporter - provides current metrics on port 9200
    ports:
      - "9200:9200"
  
  indexer:
    # CVMS Indexer - provides historical metrics on port 9300  
    ports:
      - "9300:9300"
  
  postgres:
    # Database for indexer - keep for historical data
    ports:
      - "5432:5432"

  # Disable the monitoring services since you already have them
  prometheus:
    deploy:
      replicas: 0
  
  grafana:
    deploy:
      replicas: 0
  
  alertmanager:
    deploy:
      replicas: 0
  
  promtail:
    deploy:
      replicas: 0
  
  loki:
    deploy:
      replicas: 0
  
  cadvisor:
    deploy:
      replicas: 0